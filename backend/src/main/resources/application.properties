spring.application.name=DevFlow

devflow.jwt.secret=${DEVFLOW_JWT_SECRET}

devflow.bootstrap.admin.email=${DEVFLOW_ADMIN_EMAIL:}
devflow.bootstrap.admin.password=${DEVFLOW_ADMIN_PASSWORD:}
devflow.bootstrap.admin.name=${DEVFLOW_ADMIN_NAME:}

spring.datasource.url=${DEVFLOW_DB_URL}
spring.datasource.username=${DEVFLOW_DB_USERNAME}
spring.datasource.password=${DEVFLOW_DB_PASSWORD}

# Safe default: Hibernate may validate the schema but cannot mutate it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

devflow.profile-pictures.directory=${DEVFLOW_PROFILE_PICTURE_DIR:${user.home}/.devflow/profile-pictures}
devflow.profile-pictures.max-bytes=5242880
