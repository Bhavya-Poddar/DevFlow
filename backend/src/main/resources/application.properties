spring.application.name=DevFlow

# API docs are off unless a profile/deployment explicitly enables them.
springdoc.api-docs.enabled=${DEVFLOW_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${DEVFLOW_API_DOCS_ENABLED:false}
devflow.api-docs.public-access=${DEVFLOW_API_DOCS_PUBLIC_ACCESS:false}

# Expose only the health endpoint. Liveness is process-only; readiness also checks the database.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Comma-separated exact browser origins shared by REST CORS and SockJS.
devflow.cors.allowed-origins=${DEVFLOW_CORS_ALLOWED_ORIGINS:http://localhost:5173}

devflow.jwt.secret=${DEVFLOW_JWT_SECRET}
devflow.github.enabled=false

# Process-local limits; production can override each value with environment variables.
devflow.rate-limit.max-tracked-keys=${DEVFLOW_RATE_LIMIT_MAX_TRACKED_KEYS:100000}
devflow.rate-limit.login.max-requests=${DEVFLOW_LOGIN_RATE_LIMIT_MAX_REQUESTS:10}
devflow.rate-limit.login.window=${DEVFLOW_LOGIN_RATE_LIMIT_WINDOW:15m}

devflow.bootstrap.admin.email=${DEVFLOW_ADMIN_EMAIL:}
devflow.bootstrap.admin.password=${DEVFLOW_ADMIN_PASSWORD:}
devflow.bootstrap.admin.name=${DEVFLOW_ADMIN_NAME:}

spring.datasource.url=${DEVFLOW_DB_URL}
spring.datasource.username=${DEVFLOW_DB_USERNAME}
spring.datasource.password=${DEVFLOW_DB_PASSWORD}

# Safe default: Hibernate may validate the schema but cannot mutate it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

devflow.profile-pictures.directory=${DEVFLOW_PROFILE_PICTURE_DIR:${user.home}/.devflow/profile-pictures}
devflow.profile-pictures.max-bytes=5242880
devflow.analytics.burndown-cron=0 5 0 * * *
devflow.automation.poll-delay-ms=${DEVFLOW_AUTOMATION_POLL_DELAY_MS:1000}
devflow.automation.initial-delay-ms=${DEVFLOW_AUTOMATION_INITIAL_DELAY_MS:1500}
