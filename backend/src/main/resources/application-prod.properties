# Production schema changes are versioned and applied by Flyway.
springdoc.api-docs.enabled=${DEVFLOW_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${DEVFLOW_API_DOCS_ENABLED:false}
devflow.api-docs.public-access=${DEVFLOW_API_DOCS_PUBLIC_ACCESS:false}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration
devflow.profile-pictures.directory=${DEVFLOW_PROFILE_PICTURE_DIR}
# Production must explicitly allow the deployed frontend origin; do not inherit localhost.
devflow.cors.allowed-origins=${DEVFLOW_CORS_ALLOWED_ORIGINS}

# Explicit production limits, all overridable without changing application files.
devflow.rate-limit.max-tracked-keys=${DEVFLOW_RATE_LIMIT_MAX_TRACKED_KEYS:100000}
devflow.rate-limit.login.max-requests=${DEVFLOW_LOGIN_RATE_LIMIT_MAX_REQUESTS:10}
devflow.rate-limit.login.window=${DEVFLOW_LOGIN_RATE_LIMIT_WINDOW:15m}
