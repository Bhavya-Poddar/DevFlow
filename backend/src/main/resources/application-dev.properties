# Local development only. This preserves the existing convenient schema update behavior.
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
devflow.schema.dev-update-confirmation=${DEVFLOW_DEV_DB_CONFIRMATION:}

# Looser local limits keep normal manual development/testing convenient.
devflow.rate-limit.max-tracked-keys=${DEVFLOW_RATE_LIMIT_MAX_TRACKED_KEYS:100000}
devflow.rate-limit.login.max-requests=${DEVFLOW_LOGIN_RATE_LIMIT_MAX_REQUESTS:20}
devflow.rate-limit.login.window=${DEVFLOW_LOGIN_RATE_LIMIT_WINDOW:15m}

# Local development docs are available without changing JWT/API authorization.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
devflow.api-docs.public-access=true
